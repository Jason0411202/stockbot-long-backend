# monitoring/grafana/provisioning/datasources/datasources.yml 預先佈建 Prometheus 與 VictoriaLogs 資料源。
apiVersion: 1

# 移除舊的 Loki 資料源 (已由 VictoriaLogs 取代)。
deleteDatasources:
  - name: Loki
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    uid: victorialogs
    access: proxy
    url: http://victorialogs:9428
    editable: false
